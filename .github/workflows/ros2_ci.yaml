name: Chimera Prime CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 安装 ROS 2
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      # 编译与测试 (升级到 v0.7 以修复 Humble 兼容性)
      - uses: ros-tooling/action-ros-ci@v0.7
        with:
          package-name: chimera_sensing
          target-ros2-distro: humble
          # 开启覆盖率检查的默认配置 (可选，但在 v0.7 中更稳定)
          colcon-defaults: |
            {
              "build": {
                "mixin": ["coverage-gcc"]
              }
            }